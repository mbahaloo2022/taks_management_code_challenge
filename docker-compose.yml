services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      TASKS_SQLITE_PATH: /data/tasks.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - tasks_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_BASE_URL: http://backend:8000
      NODE_ENV: development
    depends_on:
      - backend

volumes:
  tasks_data:
